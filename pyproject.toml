[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "frappe_moyasar_payments"
authors = [
    { name = "Maas Consult Middle East" }
]
description = "Reusable Moyasar hosted payment gateway for Frappe Web Forms"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = []

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
payments = ">=0.0.1"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
